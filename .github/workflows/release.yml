name: Release binaries

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tag:
    name: Create release tag
    if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create version tag
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test -n "$version"
          tag="v$version"
          git tag -f "$tag" "$GITHUB_SHA"
          git push --force origin "refs/tags/$tag"

  build:
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:'))
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: toon-world-linux-x86_64
            exe: ""
            test: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: toon-world-linux-aarch64
            exe: ""
            test: false
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: toon-world-macos-x86_64
            exe: ""
            test: false
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: toon-world-macos-aarch64
            exe: ""
            test: false
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: toon-world-windows-x86_64.exe
            exe: ".exe"
            test: false
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: toon-world-windows-aarch64.exe
            exe: ".exe"
            test: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/${{ matrix.target }}
          key: cargo-release-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-${{ matrix.target }}-

      - name: Run release-profile tests
        if: matrix.test
        run: cargo test --locked --all-features --release --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/toon-world${{ matrix.exe }}" "dist/${{ matrix.asset }}"
          bytes=$(wc -c < "dist/${{ matrix.asset }}" | tr -d ' ')
          echo "### ${{ matrix.asset }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${bytes} bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          archive: false
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs:
      - tag
      - build
    if: always() && needs.build.result == 'success' && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
            test -n "$version"
            tag="v$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums and sizes
        shell: bash
        run: |
          cd dist
          sha256sum toon-world-* > SHA256SUMS
          {
            printf '%-38s %12s\n' "FILE" "BYTES"
            printf '%-38s %12s\n' "----" "-----"
            for file in toon-world-*; do
              bytes=$(wc -c < "$file" | tr -d ' ')
              printf '%-38s %12s\n' "$file" "$bytes"
            done
          } > SIZES.txt
          cat SIZES.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/toon-world-*
            dist/SHA256SUMS
            dist/SIZES.txt
