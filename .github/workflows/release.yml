name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked --all-features

  build:
    name: Build ${{ matrix.asset }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: toon-world-linux-x86_64
            exe: ""
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: toon-world-linux-aarch64
            exe: ""
          - runner: macos-15
            target: x86_64-apple-darwin
            asset: toon-world-macos-x86_64
            exe: ""
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: toon-world-macos-aarch64
            exe: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: toon-world-windows-x86_64.exe
            exe: ".exe"
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: toon-world-windows-aarch64.exe
            exe: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/toon-world${{ matrix.exe }}" "dist/${{ matrix.asset }}"

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum toon-world-* > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/toon-world-*
            dist/SHA256SUMS
