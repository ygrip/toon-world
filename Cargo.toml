[package]
name = "toon-world"
version = "0.4.0"
edition = "2021"
description = "Fast multi-format query and transformation CLI with TOON output"
license = "MIT"
repository = "https://github.com/ygrip/toon-world"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
jaq-core = "3.1.1"
jaq-fmts = { version = "0.1.1", default-features = false, features = ["toml", "xml", "yaml"] }
jaq-json = { version = "2.0.3", features = ["serde"] }
jaq-std = "3.0.3"
pulldown-cmark = { version = "0.13.4", default-features = false }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
toon-format = { version = "0.5.0", default-features = false }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
